name: Release Image

# Builds the meta-service image when a release (checkpoint) tag is pushed and publishes it as
# ghcr.io/markvaughn/eotha-meta-service:<tag>, tagged with exactly the release tag so the tag of the code is the
# tag of the running image. Never runs for branches or pull requests, and never publishes `latest`.
# The package is private: the first publish creates it private, so do not change its visibility.
on:
  push:
    tags:
      # CalVer checkpoint tags: 20261115 or 20261115.1
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish (for example 20261115 or 20261115.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/markvaughn/eotha-meta-service

jobs:
  publish:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # The release tag, checked before anything is built or pushed. A manual run must name an existing tag
      # (the checkout below fails otherwise); a branch is never accepted.
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            echo "::error::This workflow publishes release tags only (ref $REF_NAME is a $REF_TYPE)."
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]{8}(\.[0-9]+)?$'; then
            echo "::error::'$tag' is not a CalVer release tag (YYYYMMDD or YYYYMMDD.N)."
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          persist-credentials: false

      - name: Resolve release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # arm64 (the Hetzner CAX11 demo server) is built under QEMU emulation; amd64 builds natively in the same run.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The repository's own GITHUB_TOKEN (packages: write above); no personal access token is used.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GENERATE_KEYS=0: the image carries no private key. Mount keys/private.pem and keys/public.pem (or set
      # KEYS_DIR) at run time. The Dockerfile fails the build if the Prisma query engine for the platform
      # (linux-arm64-openssl-3.0.x on arm64) is missing.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            GENERATE_KEYS=0
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.name }}
          provenance: false
