name: Meta Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eotha_meta_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eotha_meta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eotha_meta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Generate Prisma Client
        run: npm run build

      - name: Apply Database Schema
        run: npx prisma db push --skip-generate

      # Tests sign with a throwaway Ed25519 keypair and run against the Postgres service above.
      - name: Run Test Suite
        run: npm test
