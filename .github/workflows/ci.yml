name: Meta Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Generate Prisma Client
        run: npm run build

      - name: Generate Asymmetric Cryptographic Keys
        run: npm run keys:generate

      - name: Run Test Suite
        run: npm test
