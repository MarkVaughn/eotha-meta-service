name: Meta Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eotha_meta_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eotha_meta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eotha_meta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Generate Prisma Client
        run: npm run build

      - name: Apply Prisma Migrations
        run: npx prisma migrate deploy

      # Fails (exit code 2) if the migrations leave the database different from prisma/schema.prisma.
      - name: Check Schema Drift
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      # Tests sign with a throwaway Ed25519 keypair and run against the Postgres service above.
      - name: Run Test Suite
        run: npm test

  # Regenerates the contract bindings from eotha-contracts main and fails if the vendored copies differ.
  # eotha-contracts is private, so this needs the CONTRACTS_READ_TOKEN secret (fine-grained, read-only
  # contents access to that repo). A missing secret fails the job; only fork PRs, which GitHub never
  # gives secrets, skip it.
  contract-drift:
    name: Contract Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The only step that evaluates the secret in an expression to test it; it exports a boolean, never the value.
      - name: Check for contracts read token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN != '' }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK_PR" = true ]; then
            echo "::notice::Fork PR: secrets are unavailable, skipping contract drift check."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CONTRACTS_READ_TOKEN is not set; the contract drift check cannot run. Add the secret (read-only contents access to MarkVaughn/eotha-contracts)."
            exit 1
          fi

      - name: Checkout repository
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The token is used by this step alone, and persist-credentials: false keeps it out of .git/config
      # so the later steps (npm ci, buf generate) never see it.
      - name: Checkout eotha-contracts (main)
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MarkVaughn/eotha-contracts
          ref: main
          path: eotha-contracts
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js (via .nvmrc)
        if: steps.token.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # CONTRACTS_REF: HEAD is the ref checked out above; without it the script would try an
      # unauthenticated `git fetch origin main`, which cannot succeed on a private repository.
      - name: Check Contract Drift
        if: steps.token.outputs.available == 'true'
        env:
          CONTRACTS_DIR: ${{ github.workspace }}/eotha-contracts
          CONTRACTS_REF: HEAD
          CONTRACT_DRIFT_REQUIRE: '1'
        run: bash scripts/check-contract-drift.sh
